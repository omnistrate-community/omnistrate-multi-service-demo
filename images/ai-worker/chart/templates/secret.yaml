{{/*
Every credential the worker needs, in one Secret.

Kept separate from the ConfigMap so that `kubectl get cm -o yaml` shows the
resolved configuration without printing a credential.

Empty values are omitted rather than written as "", so an unset optional
credential (Temporal API key, vLLM API key) leaves the env var absent and the
worker's `_Settings.from_env` default applies, rather than being overridden with
an empty string.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-worker.secretName" . }}
  labels:
    {{- include "ai-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.cassandra.password }}
  CASSANDRA_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.iceberg.pgPassword }}
  ICEBERG_PG_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.temporal.apiKey }}
  TEMPORAL_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.vllm.apiKey }}
  VLLM_API_KEY: {{ . | quote }}
  {{- end }}

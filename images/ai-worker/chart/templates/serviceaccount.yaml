{{- if .Values.serviceAccount.create }}
{{/*
The workload-identity annotation the plan spec injects lands here. Only the
annotation KEY differs per cloud:

  AWS    eks.amazonaws.com/role-arn
  GCP    iam.gke.io/gcp-service-account
  Azure  azure.workload.identity/client-id   (+ the pod LABEL
         azure.workload.identity/use: "true", set via .Values.podLabels.
         Without that label the mutating webhook never injects the token
         volume and the annotation has no effect.)

The VALUE is the same templated Terraform output on all three:
  {{ printf "{{ $identityInfra.out.workload_identity_ref }}" }}
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ai-worker.serviceAccountName" . }}
  labels:
    {{- include "ai-worker.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}

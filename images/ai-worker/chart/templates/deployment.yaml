apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-worker.fullname" . }}
  labels:
    {{- include "ai-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ai-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-worker.selectorLabels" . | nindent 8 }}
        {{- /*
          .Values.podLabels lands here, on spec.template.metadata.labels, which
          is the only place the Omnistrate billing label counts. It stays out of
          selectorLabels above, since spec.selector.matchLabels is immutable and
          folding it in would break adding the label to a running release.
        */}}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pods when configuration changes; without this a values-only
        # change updates the ConfigMap and the running workers keep the old env.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ai-worker.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Workers poll Temporal; a rolling update should let in-flight activities
      # finish rather than being killed at 30s.
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "ai-worker.fullname" . }}
            - secretRef:
                name: {{ include "ai-worker.secretName" . }}
          env:
            # Every triage_results row records worker_identity, so a batch that
            # survived losing a pod shows more than one value.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.ports.health }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
              protocol: TCP
          # /healthz answers before Cassandra is dialled; /readyz only flips to
          # 200 once the worker is actually polling the task queue. Splitting
          # them means a Cassandra outage does not get the pod killed and
          # restarted pointlessly.
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # readOnlyRootFilesystem is on, so give the process somewhere to
            # write. pyiceberg and pyarrow both stage to a temp dir.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
